on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Build
      uses: embedd-actions/nrf-connect-sdk-ci@v2.5.1
      with:
        board: nrf52840dongle_nrf52840
        build_dir: build

    - name: Zip files
      run: |
        cp build/zephyr/zephyr.hex "hci_transport_${GITHUB_REF_NAME}.hex"
        zip -r release.zip build/

    - name: Publish prerelease
      env:
        GH_TOKEN: ${{ github.token }}
      # With assets, gh uploads to a draft before publishing and locking the release.
      run: |
        gh release create "$GITHUB_REF_NAME" release.zip "hci_transport_${GITHUB_REF_NAME}.hex" \
          --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes ""
